<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Form</title>
  </head>
  <body>
    <h2 class="title">Formulir</h2>
    <form action="#" method="post">
      <fieldset>
        <legend>Form Pendaftram</legend>
        <label for="Nama">Nama :</label><br />
        <input
          type="text"
          name="nama"
          id="nama"
          placeholder="Masukan Nama Anda"
          required
        /><br /><br />
        <label for="Nama">Email :</label><br />
        <input
          type="text"
          name="nama"
          id="nama"
          placeholder="Masukan Nama Anda"
          required
        /><br /><br />
        <label for="password">Password</label><br />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Masukan Password Anda"
          required
        /><br /><br />

        <!-- select group -->
        <label for="jurusan">Pilihan Juruusan :</label><br />
        <select name="jurusan" id="jurusan">
          <optgroup label="FEB">
            <option value="akutansi">Akutansi</option>
            <option value="Manajemen">Manajemen</option>
          </optgroup>
          <optgroup label="FTI">
            <option value="informatika">Informatika</option>
            <option value="elektro">elektro</option>
          </optgroup></select
        ><br /><br />

        <!-- textarea -->
        <label for="alamat">Alamat :</label>
        <textarea
          name="alamat"
          id="alamat"
          rows="4"
          cols="30"
          placeholder="Masukan Alamat"
          required
        ></textarea
        ><br /><br />

        <!-- Checkbox & Radio -->
        <label for="hobi">Hobi</label><br />
        <input type="checkbox" name="hobi" value="membaca" /> membaca
        <input type="checkbox" name="hobi" value="menulis" /> menulis
        <input type="checkbox" name="hobi" value="menyanyi" /> menyanyi
        <br /><br />

        <label for="jeniskelamin">Jenis Kelamin</label><br />
        <input type="radio" name="jeniskelamin" value="laki" />Laki laki
        <input type="radio" name="jeniskelamin" value="perempuan" />Perempuan
      </fieldset>
    </form>
  </body>
</html>
