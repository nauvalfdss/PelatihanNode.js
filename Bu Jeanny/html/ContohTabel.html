<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Tabel</title>
  </head>
  <body>
    <h2 class="judul">Tabel</h2>

      <thead>
        <tr>
          <th>Nama</th>
          <th>Umur</th>
          <th>Kota</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Firdaus</td>
          <td>20</td>
          <td>Bekasi</td>
        </tr>
        <tr>
          <td>Opal</td>
          <td>19</td>
          <td>Kranji</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
