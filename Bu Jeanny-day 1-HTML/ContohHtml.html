<html lang="en">
  <head>

    <title>Elemen pada Html</title>
  </head>
  <body>
    <!-- Heading -->
    <h1>Judul Utama H1</h1>
    <h2>SubJudul H2</h2>

      Ini adalah contoh paragraf. <b>Teks Tebal</b>, <i>Teks Miring</i>,

      <sub>Pangkat Bawah</sub>
    </p>
