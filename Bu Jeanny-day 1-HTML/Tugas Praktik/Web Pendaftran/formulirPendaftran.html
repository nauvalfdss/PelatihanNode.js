<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Formulir Pendaftran</title>
  </head>
  <body>
    <center>
      <header>
        <a href="formulirPendaftran.html">Formulir Pendaftran</a>
        <a href="tabelPeserta.html">Tabel Peserta</a>
        <hr />
        <h2>Formulir Pendaftran</h2>
      </header>
    </center>
    <hr />
    <form>
      <fieldset>
        <legend>Data Pribadi</legend>
        <label for="nama">Nama</label><br />
        <input type="text" name="nama" id="nama" /><br />
        <br />
        <label for="jk">Jenis Kelamin :</label><br />
        <input type="radio" name="jk" id="jk" value="laki" />Laki laki
        <input type="radio" name="jk" id="jk" value="perempuan" />Perempuan
        <br />

        <label for="agama">Agama :</label><br />
        <select name="agama" id="agama">
          <optgroup label="Agama Mayoritas">
            <option value="islam">Islam</option>
            <option value="kristen">Kristen</option>
          </optgroup>
          <optgroup label="Agama Lain">
            <option value="islam">Islam</option>
            <option value="kristen">Kristen</option>
          </optgroup>
        </select>
        <br /><br />

        <label for="tempat">Tempat Lahir :</label><br />
        <input type="text" name="tempat" id="tempat" />
        <br /><br />

        <label for="ttl">Tanggal Lahir :</label><br />
        <input type="date" name="ttl" id="ttl" />
        <br /><br />

        <label for="alamat">Alamat :</label><br />
        <textarea name="alamat" id="alamat"></textarea>
        <br /><br />
      </fieldset>
    </form>
    <br />

    <form>
      <fieldset>
        <legend>Pendidikan</legend>
        <label for="sd">SD :</label><br />
        <input type="text" name="sd" id="sd" />
        <label for="masuk">Masuk :</label>
        <input type="date" name="masuk" id="masuk" />
        <label for="keluar">Keluar :</label>
        <input type="date" name="" id="" />
        <br /><br />
        <label for="smp">SMP :</label><br />
        <input type="text" name="smp" id="smp" />
        <label for="masuk">Masuk :</label>
        <input type="date" name="masuk" id="masuk" />
        <label for="keluar">Keluar</label>
        <input type="date" name="keluar" id="keluar" />
        <br /><br />
        <label for="smp">SMA :</label><br />
        <input type="text" name="smp" id="smp" />
        <label for="masuk">Masuk :</label>
        <input type="date" name="masuk" id="masuk" />
        <label for="keluar">Keluar</label>
        <input type="date" name="keluar" id="keluar" />
      </fieldset>
    </form>
    <br />

    <form>
      <fieldset>
        <legend>Pelatihan</legend>
        <label for="minat">Minat :</label><br />
        <input type="checkbox" name="html" id="html" />HTML
        <input type="checkbox" name="css" id="css" />CSS
        <input type="checkbox" name="php" id="php" />PHP <br /><br />
        <label for="minat">Kompetensi :</label><br />
        <input type="checkbox" name="html" id="html" />HTML
        <input type="checkbox" name="css" id="css" />CSS
        <input type="checkbox" name="php" id="php" />PHP <br /><br />
      </fieldset>
    </form>
    <br />

    <form>
      <fieldset>
        <legend>Pilih Jurusan</legend>
        <select name="Jurusan" id="Jurusan">
          <optgroup label="Teknik">
            <option value="ti">Teknik Informatika</option>
            <option value="si">Sistem Informasi</option>
            <option value="i">Informatika</option>
          </optgroup>
          <optgroup label="Ekonomi">
            <option value="ti">Akutansi</option>
            <option value="si">Bisnis</option>
            <option value="i">Perbamkan</option>
          </optgroup>
        </select>
      </fieldset>
      <br />
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
